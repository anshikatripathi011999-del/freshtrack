<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshTrack | Sign Up</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-icon">🥬</span>
          <h1>FreshTrack</h1>
        </div>
        <h2>Create Account</h2>
        <p class="auth-subtitle">Start tracking groceries smarter.</p>

        <form id="signupForm" class="auth-form">
          <label>
            Full Name
            <input type="text" id="signupName" name="name" placeholder="Your full name" required />
          </label>

          <label>
            Email
            <input type="email" id="signupEmail" name="email" placeholder="you@example.com" required />
          </label>

          <label>
            Password
            <input type="password" id="signupPassword" name="password" placeholder="Enter password" required />
          </label>

          <label>
            Confirm Password
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required />
          </label>

          <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>

        <div id="signupError" class="form-message error" aria-live="polite"></div>

        <p class="auth-switch">
          Already have an account?
          <a href="/login.html">Login</a>
        </p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
  </body>
</html>
