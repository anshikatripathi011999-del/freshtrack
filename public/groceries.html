<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshTrack | My Groceries</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="app-body">
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand sidebar-brand">
          <span class="brand-icon">🥬</span>
          <span>FreshTrack</span>
        </div>
        <nav class="sidebar-nav">
          <a href="/dashboard.html">Dashboard</a>
          <a class="active" href="/groceries.html">My Groceries</a>
          <a href="/add-grocery.html">Add Grocery</a>
          <a href="/bill-import.html">Bill Import</a>
        </nav>
      </aside>
      <main class="content-area">
        <header class="topbar">
          <div>
            <p class="eyebrow">The full picture</p>
            <h1>My Groceries</h1>
            <p class="page-subtitle">Everything in your kitchen, with the dates that matter.</p>
          </div>
          <div class="topbar-actions">
            <button id="notificationBtn" class="icon-btn" type="button" aria-label="Notifications">🔔</button>
            <button class="btn btn-quiet" data-logout="true" type="button">Log out</button>
          </div>
        </header>

        <section class="toolbar">
          <label class="search-field" aria-label="Search groceries">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="text" placeholder="Search groceries..." />
          </label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
          </select>
          <select id="statusFilter">
            <option value="">All Status</option>
            <option value="Fresh">Fresh</option>
            <option value="Expiring Soon">Expiring Soon</option>
            <option value="Expired">Expired</option>
          </select>
        </section>

        <p id="groceryCount" class="item-count" aria-live="polite"></p>

        <section class="card-section">
          <div id="groceriesGrid" class="groceries-grid"></div>
        </section>

        <dialog id="editGroceryDialog" class="edit-dialog">
          <form id="editGroceryForm" class="edit-grocery-form">
            <div class="edit-dialog-header">
              <div><p class="eyebrow">Grocery details</p><h2>Edit grocery</h2></div>
              <button id="closeEditDialog" class="icon-btn dialog-close" type="button" aria-label="Close edit form">×</button>
            </div>
            <div class="edit-form-grid">
              <label>Grocery name<input id="editName" name="name" required /></label>
              <label>Category<select id="editCategory" name="category" required>
                <option value="Fruits">Fruits</option><option value="Vegetables">Vegetables</option>
                <option value="Dairy">Dairy</option><option value="Bakery">Bakery</option>
                <option value="Snacks">Snacks</option><option value="Beverages">Beverages</option>
                <option value="Meat">Meat</option><option value="Pantry">Pantry</option>
                <option value="Frozen">Frozen</option><option value="Household">Household</option>
                <option value="Other">Other</option>
              </select></label>
              <label>Quantity<input id="editQuantity" name="quantity" type="number" min="0.01" step="0.01" required /></label>
              <label>Unit<input id="editUnit" name="unit" required /></label>
              <label>Purchase date<input id="editPurchaseDate" name="purchaseDate" type="date" required /></label>
              <label>Expiry date<input id="editExpiryDate" name="expiryDate" type="date" /></label>
              <label>Price<input id="editPrice" name="price" type="number" min="0" step="0.01" required /></label>
            </div>
            <p id="editGroceryMessage" class="edit-form-message" aria-live="polite"></p>
            <div class="form-actions edit-form-actions">
              <button id="cancelEditDialog" class="btn btn-secondary" type="button">Cancel</button>
              <button class="btn btn-primary" type="submit">Save changes</button>
            </div>
          </form>
        </dialog>

      </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/groceries.js"></script>
  </body>
</html>
